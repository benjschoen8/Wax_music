<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="115" ry="115"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="#14161A"/>

  <g clip-path="url(#squircle)">
    <!-- Vinyl Records stacked in crate -->
    <!-- Back record -->
    <circle cx="230" cy="190" r="130" fill="#1C1E23"/>
    <circle cx="230" cy="190" r="105" fill="none" stroke="#252830" stroke-width="4"/>
    <circle cx="230" cy="190" r="45" fill="#3A3E4A"/>

    <!-- Front primary vinyl record -->
    <circle cx="270" cy="210" r="145" fill="#0E0F12"/>
    <circle cx="270" cy="210" r="125" fill="none" stroke="#1A1C22" stroke-width="4"/>
    <circle cx="270" cy="210" r="105" fill="none" stroke="#1A1C22" stroke-width="4"/>
    <circle cx="270" cy="210" r="85" fill="none" stroke="#1A1C22" stroke-width="4"/>
    <circle cx="270" cy="210" r="55" fill="#F2B632"/>
    <circle cx="270" cy="210" r="16" fill="#0E0F12"/>

    <!-- Flat Modern Crate Front (Amber & Charcoal) -->
    <!-- Slanted / 2.5D flat geometric crate -->
    <path d="M 64 290 L 448 290 L 432 444 A 20 20 0 0 1 412 462 L 100 462 A 20 20 0 0 1 80 444 Z" fill="#F2B632"/>
    
    <!-- Crate Slats (Dark insets) -->
    <rect x="96" y="314" width="320" height="26" rx="6" fill="#14161A"/>
    <rect x="100" y="358" width="312" height="26" rx="6" fill="#14161A"/>
    <rect x="104" y="402" width="304" height="26" rx="6" fill="#14161A"/>

    <!-- Crate Handle cutout in middle slat -->
    <rect x="206" y="320" width="100" height="14" rx="7" fill="#F2B632"/>
  </g>
</svg>
