<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="squircle">
      <rect x="0" y="0" width="512" height="512" rx="115" ry="115"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="#14161A"/>

  <g clip-path="url(#squircle)">
    <!-- Big Bold Centered Vinyl Record -->
    <circle cx="256" cy="220" r="160" fill="#181A20"/>
    <circle cx="256" cy="220" r="130" fill="none" stroke="#252832" stroke-width="6"/>
    <circle cx="256" cy="220" r="100" fill="none" stroke="#252832" stroke-width="6"/>
    <circle cx="256" cy="220" r="60" fill="#F2B632"/>
    <circle cx="256" cy="220" r="18" fill="#14161A"/>

    <!-- Geometric Flat Crate outline & slats in Amber -->
    <path d="M 76 270 L 436 270 L 436 430 A 16 16 0 0 1 420 446 L 92 446 A 16 16 0 0 1 76 430 Z" fill="#1E2028" stroke="#F2B632" stroke-width="12" stroke-linejoin="round"/>
    
    <!-- Slats -->
    <line x1="76" y1="328" x2="436" y2="328" stroke="#F2B632" stroke-width="10"/>
    <line x1="76" y1="386" x2="436" y2="386" stroke="#F2B632" stroke-width="10"/>

    <!-- Handle cutout -->
    <rect x="206" y="288" width="100" height="24" rx="12" fill="#14161A" stroke="#F2B632" stroke-width="8"/>
  </g>
</svg>
